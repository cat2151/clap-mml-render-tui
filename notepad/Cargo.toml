[package]
name = "cmrt-notepad"
version = "0.1.0"
edition = "2021"

[features]
# app 側のテストから crate 内のテスト専用ヘルパ（new_for_test 等）を
# 使えるようにするフラグ。prod ビルドでは無効。
test-support = []

[dependencies]
cmrt-history = { path = "../history" }
cmrt-offline-render = { path = "../offline-render" }
cmrt-realtime-play = { path = "../realtime-play" }
cmrt-render-core = { path = "../core-lib" }
cmrt-runtime = { path = "../cmrt-runtime" }
cmrt-surge-patches = { path = "../surge-patches" }
cmrt-tui-core = { path = "../tui-core" }
mmlabc-to-smf = { git = "https://github.com/cat2151/mmlabc-to-smf-rust.git", package = "mmlabc-to-smf", features = ["cli"] }
anyhow = "1"
crossterm = "0.29"
hound = "3.5"
ratatui = "0.30"
rodio = "0.22"
serde_json = "1"
ratatui-textarea = { version = "0.9", features = ["crossterm"] }

[dev-dependencies]
# 実クリップボードに触れないスタブと、history パスのテスト用差し替えを使う。
cmrt-tui-core = { path = "../tui-core", features = ["test-support"] }
cmrt-history = { path = "../history", features = ["test-support"] }
