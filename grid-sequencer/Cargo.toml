[package]
name = "cmrt-grid-sequencer"
version = "0.1.0"
edition = "2021"

[dependencies]
cmrt-arpeggiator = { path = "../arpeggiator" }
cmrt-chord = { path = "../chord" }
cmrt-realtime-play = { path = "../realtime-play" }
cmrt-rhythm = { path = "../rhythm" }
cmrt-surge-patches = { path = "../surge-patches" }
cmrt-tui-core = { path = "../tui-core" }
anyhow = "1"
crossterm = "0.29"
rand = "0.10"
ratatui = "0.30"
ratatui-textarea = { version = "0.9", features = ["crossterm"] }

[dev-dependencies]
cmrt-runtime = { path = "../cmrt-runtime" }
# 描画テストで buffer_test（全角文字を含む文字列の探索）を使う。
cmrt-tui-core = { path = "../tui-core", features = ["test-support"] }
