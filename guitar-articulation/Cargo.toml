[package]
name = "cmrt-guitar-articulation"
version = "0.1.0"
edition = "2021"

[dependencies]
# 入力 MML → 時刻つきイベント列（`timed_performance`）。
cmrt-chord = { path = "../chord" }
# 演奏の後ろに掛ける effect chain（ギターアンプなど）を選ぶ overlay。
cmrt-effect-chain-select = { path = "../effect-chain-select" }
cmrt-midi-filter = { path = "../midi-filter" }
# effect の catalog（`EffectPlugins`）。
cmrt-render-core = { path = "../core-lib" }
cmrt-tui-core = { path = "../tui-core" }
# キー入力。ratatui / app 側と同じ版に揃えること。
crossterm = "0.29"
ratatui = "0.30"
# MML の 1 行入力欄。自前で String へ push/pop しない（プロジェクト共通の作法）。
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
# ルール表を 1 行の JSON でログへ残し、CLI で読み戻す。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
