[package]
name = "cmrt-keyboard"
version = "0.1.0"
edition = "2021"

[dependencies]
cmrt-realtime-play = { path = "../realtime-play" }
cmrt-runtime = { path = "../cmrt-runtime" }
cmrt-tui-core = { path = "../tui-core" }
chord2mml-core = { git = "https://github.com/cat2151/chord2mml-rust", package = "chord2mml-core", features = ["tree-sitter"] }
mmlabc-to-smf = { git = "https://github.com/cat2151/mmlabc-to-smf-rust.git", package = "mmlabc-to-smf", features = ["cli"] }
anyhow = "1"
crossterm = "0.28"
midly = "0.5"
rand = "0.8"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
tui-textarea = { version = "0.6", features = ["crossterm"] }

[dev-dependencies]
serde_json = "1"
