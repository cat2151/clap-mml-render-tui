[package]
name = "cmrt-effect-chain-select"
version = "0.1.0"
edition = "2021"

[dependencies]
# selector に出す preset の選別（`is_selectable_effect_preset`）と list の scroll 規則。
cmrt-patch-select = { path = "../patch-select" }
# effect の catalog（`AudioEffectCatalog`）と、chain の段の JSON キー。
cmrt-render-core = { path = "../core-lib" }
cmrt-tui-core = { path = "../tui-core" }
# キー入力。ratatui / app 側と同じ版に揃えること。
crossterm = "0.29"
ratatui = "0.30"
# list の絞り込み入力欄。自前で String へ push/pop しない（プロジェクト共通の作法）。
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
serde_json = "1"
