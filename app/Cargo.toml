[package]
name = "clap-mml-render-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cmrt"
path = "src/main.rs"

[dependencies]
cmrt-chord = { path = "../chord" }
cmrt-config-editor = { path = "../config-editor-lib" }
cmrt-daw = { path = "../daw" }
cmrt-grid-sequencer = { path = "../grid-sequencer" }
cmrt-patches = { path = "../patches" }
cmrt-history = { path = "../history" }
cmrt-keyboard = { path = "../keyboard" }
cmrt-loop-browser = { path = "../loop-browser" }
cmrt-loop-browser-domain = { path = "../loop-browser-domain" }
cmrt-loop-domain = { path = "../loop-domain" }
cmrt-mml-overlay = { path = "../mml-overlay" }
cmrt-notepad = { path = "../notepad" }
cmrt-offline-render = { path = "../offline-render" }
cmrt-realtime-play = { path = "../realtime-play" }
cmrt-render-core = { path = "../core-lib" }
cmrt-runtime = { path = "../cmrt-runtime" }
cmrt-tui-core = { path = "../tui-core" }
rubberband-ffi = { path = "../rubberband-ffi" }
chord2mml-core = { git = "https://github.com/cat2151/chord2mml-rust", package = "chord2mml-core", features = ["tree-sitter"] }
rand = "0.10"

# TUI
ratatui = "0.30"
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
crossterm = "0.29"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Error handling
anyhow = "1"
thiserror = "2"
clap = { version = "4.6.0", features = ["derive", "string"] }
cat-self-update-lib = { git = "https://github.com/cat2151/cat-self-update", package = "cat-self-update-lib" }

# HTTP server (for --server mode)
tiny_http = "0.12"

# HTTP client (for auto-update check)
ureq = { version = "3", features = ["json"] }

# Audio output for server WAV conversion
hound = "3.5"
rodio = "0.22"
midly = "0.5"
rustfft = "6.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# MML preprocessing in app-side TUI/DAW modules
mmlabc-to-smf = { git = "https://github.com/cat2151/mmlabc-to-smf-rust.git", package = "mmlabc-to-smf", features = ["cli"] }

# CLAP host type re-export usage in app signatures
clack-host = { git = "https://github.com/prokopyl/clack.git", package = "clack-host" }

[dev-dependencies]
# app のテストから DAW crate のテスト専用ヘルパ（HTTP モード切替要求の注入）を使うためのフラグ。
cmrt-daw = { path = "../daw", features = ["test-support"] }
# app のテストから loop browser crate のテスト専用ヘルパを使うためのフラグ。
cmrt-loop-browser = { path = "../loop-browser", features = ["test-support"] }
# app のテストから notepad crate のテスト専用ヘルパを使うためのフラグ。
cmrt-notepad = { path = "../notepad", features = ["test-support"] }
# app のテストで、実クリップボードに触れないスタブ実装を使うためのフラグ。
cmrt-tui-core = { path = "../tui-core", features = ["test-support"] }
# app のテストから history パスをテスト専用ディレクトリへ差し替えるためのフラグ。
cmrt-history = { path = "../history", features = ["test-support"] }
