name: Update cat2151 Rust Git Dependencies

on:
  schedule:
    # JST 01:00 (UTC 16:00 previous day)
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cat2151-rust-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-cat2151-rust-deps:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Collect cat2151 Git dependencies
        id: collect
        run: |
          set -euo pipefail

          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/cargo-metadata-before.json"

          # Windows の python は stdout へ CRLF を書くので、行末の CR を落とす。
          python - <<'PY' | tr -d '\r' > "$RUNNER_TEMP/cat2151-git-packages.tsv"
          import json
          import os
          import subprocess
          import sys
          from urllib.parse import urlparse

          with open(os.path.join(os.environ["RUNNER_TEMP"], "cargo-metadata-before.json"), encoding="utf-8") as f:
              metadata = json.load(f)

          def git_repo_url(source):
              if not source.startswith("git+"):
                  return None
              return source[len("git+"):].split("#", 1)[0]

          def is_cat2151_github_repo(repo_url):
              parsed = urlparse(repo_url)
              host = parsed.netloc.lower()
              if "@" in host:
                  host = host.rsplit("@", 1)[1]
              path = parsed.path.lstrip("/").lower()
              return host == "github.com" and path.startswith("cat2151/")

          packages_by_source = {}
          fixed_sources = []
          for package in metadata.get("packages", []):
              source = package.get("source") or ""
              repo_url = git_repo_url(source)
              if repo_url is None or not is_cat2151_github_repo(repo_url):
                  continue

              query = urlparse(repo_url).query
              query_keys = {part.split("=", 1)[0] for part in query.split("&") if part}
              if "rev" in query_keys or "tag" in query_keys:
                  fixed_sources.append(source)
                  continue

              packages_by_source.setdefault(repo_url, package)

          if fixed_sources:
              print("cat2151 Git dependency uses rev/tag pinning, which is prohibited:", file=sys.stderr)
              for source in fixed_sources:
                  print(f"- {source}", file=sys.stderr)
              sys.exit(1)

          # 上流に新しい commit が無い依存は `cargo update -p` しない。
          # `-p` は上流が同じでも依存を選び直し、windows-sys 等を lock 内の古い版へ寄せてしまう。
          def upstream_head(repo_url):
              parsed = urlparse(repo_url)
              query = dict(part.split("=", 1) for part in parsed.query.split("&") if "=" in part)
              ref = f"refs/heads/{query['branch']}" if "branch" in query else "HEAD"
              url = parsed._replace(query="").geturl()
              out = subprocess.run(["git", "ls-remote", url, ref], check=True,
                                   capture_output=True, text=True).stdout.split()
              if not out:
                  sys.exit(f"git ls-remote returned nothing for {url} {ref}")
              return out[0]

          for repo_url, package in sorted(packages_by_source.items()):
              locked = package["source"].split("#", 1)[1]
              if upstream_head(repo_url) == locked:
                  print(f"Unchanged upstream, skipped: {package['name']} {locked}", file=sys.stderr)
                  continue
              print(f"{package['id']}\t{package['name']}\t{package['source']}")
          PY

          count=$(wc -l < "$RUNNER_TEMP/cat2151-git-packages.tsv" | tr -d '[:space:]')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          if [ "${count}" = "0" ]; then
            echo "No cat2151 Git dependency has new upstream commits"
          else
            echo "Found ${count} cat2151 Git dependency source(s) with new upstream commits:"
            cut -f2-3 "$RUNNER_TEMP/cat2151-git-packages.tsv"
          fi

      - name: Update cat2151 Git dependencies
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r package_id package_name package_source; do
            echo "Updating ${package_name} from ${package_source}"
            cargo update -p "${package_id}"
          done < "$RUNNER_TEMP/cat2151-git-packages.tsv"

      - name: Build update summary
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail

          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/cargo-metadata-after.json"

          python - <<'PY' | tr -d '\r' > "$RUNNER_TEMP/cat2151-update-summary.md"
          import json
          import os
          from urllib.parse import urlparse

          def load(name):
              with open(os.path.join(os.environ["RUNNER_TEMP"], name), encoding="utf-8") as f:
                  return json.load(f)

          def git_repo_url(source):
              if not source.startswith("git+"):
                  return None
              return source[len("git+"):].split("#", 1)[0]

          def is_cat2151_github_repo(repo_url):
              parsed = urlparse(repo_url)
              host = parsed.netloc.lower()
              if "@" in host:
                  host = host.rsplit("@", 1)[1]
              path = parsed.path.lstrip("/").lower()
              return host == "github.com" and path.startswith("cat2151/")

          def precise(source):
              return source.split("#", 1)[1] if "#" in source else ""

          def collect(metadata):
              packages = {}
              for package in metadata.get("packages", []):
                  source = package.get("source") or ""
                  repo_url = git_repo_url(source)
                  if repo_url is None or not is_cat2151_github_repo(repo_url):
                      continue
                  key = (package["name"], package["version"], repo_url)
                  packages[key] = source
              return packages

          before = collect(load("cargo-metadata-before.json"))
          after = collect(load("cargo-metadata-after.json"))

          lines = []
          for name, version, repo_url in sorted(set(before) | set(after)):
              old_source = before.get((name, version, repo_url))
              new_source = after.get((name, version, repo_url))
              if old_source == new_source:
                  continue
              old = precise(old_source) if old_source else "missing"
              new = precise(new_source) if new_source else "missing"
              lines.append(f"- {name}@{version}: {old} -> {new}")

          if lines:
              print("Updated cat2151 Rust Git dependencies:")
              print()
              print("\n".join(lines))
          else:
              print("No cat2151 Rust Git dependency source revisions changed.")
          PY

          cat "$RUNNER_TEMP/cat2151-update-summary.md"

      - name: Check for Cargo.lock changes
        id: changes
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.lock changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- Cargo.lock
          fi

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          {
            echo "chore: update cat2151 Rust git dependencies [auto]"
            echo
            cat "$RUNNER_TEMP/cat2151-update-summary.md"
          } > "$RUNNER_TEMP/cat2151-commit-message.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -F "$RUNNER_TEMP/cat2151-commit-message.txt"
            git push
          fi
