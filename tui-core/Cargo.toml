[package]
name = "cmrt-tui-core"
version = "0.1.0"
edition = "2021"

[features]
# app 側のテストから、実クリップボードに触れないスタブ実装や
# テスト専用ヘルパを使えるようにするフラグ。prod ビルドでは無効。
test-support = []

[dependencies]
cmrt-core = { path = "../core-lib" }
cmrt-realtime-play = { path = "../realtime-play" }
cmrt-runtime = { path = "../cmrt-runtime" }
anyhow = "1"
arboard = "3.6.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
hound = "3.5"
rand = "0.10"
ratatui = "0.30"
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
ratatui-textarea = { version = "0.9", features = ["crossterm"] }

# メモリ計測（memory モジュール）。プロセス一覧の走査と Working Set / 空き物理メモリの取得。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
