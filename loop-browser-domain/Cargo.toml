[package]
name = "cmrt-loop-browser-domain"
version = "0.1.0"
edition = "2021"

[dependencies]
cmrt-loop-domain = { path = "../loop-domain" }
cmrt-runtime = { path = "../cmrt-runtime" }
cmrt-tui-core = { path = "../tui-core" }
rubberband-ffi = { path = "../rubberband-ffi" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rand = "0.10"
rodio = "0.22"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
