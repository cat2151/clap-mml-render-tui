[package]
name = "cmrt-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "cmrt_runtime"
path = "src/lib.rs"

[dependencies]
cmrt-patches = { path = "../patches" }
# config.toml のうち「プラグインをロードする側の知識」（標準インストール先・
# active_plugin の解決規則・音色ディレクトリの畳み込み）は play server repo 側が単一ソース。
cmrt-server-config = { git = "https://github.com/cat2151/clap-mml-play-server", package = "cmrt-server-config" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
