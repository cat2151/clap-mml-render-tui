[package]
name = "cmrt-chord-chart"
version = "0.1.0"
edition = "2021"

[dependencies]
cmrt-history = { path = "../history" }
cmrt-tui-core = { path = "../tui-core" }
anyhow = "1"
# キー入力（`handle_key_event`）。ratatui / app 側と同じ版に揃えること。
crossterm = "0.29"
ratatui = "0.30"
# 1 行入力欄（`n` / `b`）。自前で String へ push/pop しない（プロジェクト共通の作法）。
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# chord_chart.json の保存先をテスト専用ディレクトリへ差し替えるためのフラグ。
cmrt-history = { path = "../history", features = ["test-support"] }
# 描画テストで buffer_test（全角文字を含む文字列の探索）を使う。
cmrt-tui-core = { path = "../tui-core", features = ["test-support"] }
