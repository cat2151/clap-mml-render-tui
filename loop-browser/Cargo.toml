[package]
name = "cmrt-loop-browser"
version = "0.1.0"
edition = "2021"

[features]
# app 側のテストから crate 内のテスト専用ヘルパ（handle_key / set_playback_beat_for_test 等）を
# 使えるようにするフラグ。prod ビルドでは無効。
test-support = []

[dependencies]
cmrt-loop-browser-domain = { path = "../loop-browser-domain" }
cmrt-loop-domain = { path = "../loop-domain" }
cmrt-runtime = { path = "../cmrt-runtime" }
cmrt-tui-core = { path = "../tui-core" }
rubberband-ffi = { path = "../rubberband-ffi" }
anyhow = "1"
rand = "0.10"
regex = "1"
rodio = "0.22"
ratatui = "0.30"
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
crossterm = "0.29"

[dev-dependencies]
# 描画テストで buffer_test（全角文字を含む文字列の探索）を使う。
cmrt-tui-core = { path = "../tui-core", features = ["test-support"] }
# CMRT_LOOP_INDEX_JSON で渡された実ライブラリの loop_index.json を読む性能テスト用。
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
